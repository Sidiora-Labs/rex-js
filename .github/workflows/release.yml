name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag, ancestry, version and changelog section
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag commit is an ancestor of main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged" origin/main; then
            echo "tag ${GITHUB_REF_NAME} points at ${tagged}, which is not an ancestor of main" >&2
            exit 1
          fi
      - name: Tag matches the package version
        id: version
        run: |
          version="$(node -p "require('./packages/rex/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/rex version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Extract the CHANGELOG section of this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v version="$VERSION" '
            BEGIN {
              gsub(/\./, "\\.", version)
              heading = "^## \\[?v?" version "([^0-9A-Za-z.-]|$)"
            }
            /^## / { if (inside) exit; inside = ($0 ~ heading); next }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/release.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/release.md"; then
            echo "CHANGELOG.md has no section headed ## [${VERSION}]" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes/release.md"
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release.md
          if-no-files-found: error

  checks:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish @sidioralabs/rex to npm with provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, checks]
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sidioralabs/rex/v/${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: The bundled npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(`npm ${process.argv[1]} cannot publish through OIDC; pin a Node whose npm is 11.5.1 or later`);
              process.exit(1);
            }
          ' "$(npm --version)"
      - name: Download the tarball the smoke test passed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish with provenance through OIDC
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -- "$RUNNER_TEMP"/package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one tarball in $RUNNER_TEMP/package" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          npm publish "$1" --provenance --access public --tag "$dist_tag"

  verify-published:
    name: Install the published version from the registry and import every entry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare, publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Verify the published version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/verify-published.mjs --version "$VERSION"

  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, publish, verify-published]
    permissions:
      contents: write
    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Download the published tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Create the release with the CHANGELOG section as its body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -- "$RUNNER_TEMP"/package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one tarball in $RUNNER_TEMP/package" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$1" --verify-tag $prerelease \
            --title "@sidioralabs/rex ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes/release.md"
