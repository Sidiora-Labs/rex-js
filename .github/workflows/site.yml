name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "packages/rex/**"
      - "CHANGELOG.md"
      - "tools/serve-static.mjs"
      - "tools/serve-static.test.mjs"
      - "tools/site-verify.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "packages/rex/**"
      - "CHANGELOG.md"
      - "tools/serve-static.mjs"
      - "tools/serve-static.test.mjs"
      - "tools/site-verify.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Check, test and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Static server tests
        run: node --test tools/serve-static.test.mjs
      - name: Check
        run: pnpm -C site check
      - name: Unit tests
        run: pnpm -C site test:unit
      - name: Build
        run: pnpm -C site build

  e2e:
    name: Build the static site and run the gates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Static build
        run: pnpm -C site build:static
      - name: Install browsers
        run: pnpm -C site exec playwright install --with-deps chromium
      - name: Gates
        run: pnpm -C site test:e2e
      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-e2e-report
          path: |
            site/e2e/report
            site/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/client

  deploy:
    name: Deploy to GitHub Pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
