name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "packages/rex/**"
      - "CHANGELOG.md"
      - "tools/serve-static.mjs"
      - "tools/serve-static.test.mjs"
      - "tools/site-verify.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "packages/rex/**"
      - "CHANGELOG.md"
      - "tools/serve-static.mjs"
      - "tools/serve-static.test.mjs"
      - "tools/site-verify.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Check, test and build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Static server tests
        run: node --test tools/serve-static.test.mjs
      - name: Check
        run: pnpm -C site check
      - name: Unit tests
        run: pnpm -C site test:unit
      - name: Build
        run: pnpm -C site build

  e2e:
    name: Build the static site and run the gates
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Static build
        run: pnpm -C site build:static
      - name: Install browsers
        run: pnpm -C site exec playwright install --with-deps chromium firefox webkit
      - name: Gates
        run: pnpm -C site test:e2e
      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e-report
          path: |
            site/e2e/report
            site/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/client

  deploy:
    name: Deploy to GitHub Pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
