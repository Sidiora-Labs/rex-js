name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -C packages/rex test

  docs:
    name: Docs and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Freshness (generated pointer files are checked where cg is installed)
        run: node tools/freshness.mjs --check --skip pointers

  demo:
    name: Check, walk and vitals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Check
        run: pnpm -C examples/demo exec rex check
      - name: Install browsers
        run: pnpm -C examples/demo exec playwright install --with-deps chromium
      - name: Walk
        run: pnpm -C examples/demo exec playwright test e2e/operability.spec.ts
      - name: Vitals
        run: pnpm -C examples/demo test:vitals

  supply-chain:
    name: Audit and license review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod
      - name: License review
        run: node tools/license-review.mjs
