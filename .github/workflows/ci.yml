name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -C packages/rex test

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint the demo
        run: pnpm -C examples/demo lint
      - name: Lint with the root config, or every other package config until one exists
        run: |
          if [ -f eslint.config.js ]; then
            pnpm exec eslint .
          else
            for config in packages/*/eslint.config.js examples/*/eslint.config.js; do
              [ -f "$config" ] || continue
              dir="$(dirname "$config")"
              [ "$dir" = examples/demo ] && continue
              pnpm -C "$dir" exec eslint .
            done
          fi
      - name: Format check of packages/rex/src with the rex preset
        run: pnpm -C packages/rex exec prettier --config src/prettier.ts --check src
      - name: Format check of examples/demo with the rex preset
        run: pnpm -C examples/demo exec prettier --config ../../packages/rex/src/prettier.ts --check .

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: pnpm -C packages/rex exec vitest run --coverage
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: packages/rex/coverage

  demo:
    name: Check, walk and vitals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Unit
        run: pnpm -C examples/demo test:unit
      - name: Install browsers
        run: pnpm -C examples/demo exec playwright install --with-deps chromium
      - name: Check and walk (operability, no-JS, axe, vitals, lighthouse, screenshots)
        run: pnpm -C examples/demo test

  docs:
    name: Docs and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Links and API pages
        run: pnpm docs:check
      - name: Freshness (generated pointer files are checked where cg is installed)
        run: node tools/freshness.mjs --check --skip pointers

  supply-chain:
    name: Audit and license review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod
      - name: License review
        run: node tools/license-review.mjs

  package:
    name: Pack and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build rex
        run: pnpm -C packages/rex build
      - name: Pack
        run: pnpm -C packages/rex pack --pack-destination "$RUNNER_TEMP/package"
      - name: Smoke test the tarball in a fresh app
        run: |
          set -- "$RUNNER_TEMP"/package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one tarball in $RUNNER_TEMP/package" >&2
            exit 1
          fi
          sh tools/smoke-package.sh "$1"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, lint, coverage, demo, docs, supply-chain, package]
    if: ${{ always() }}
    steps:
      - name: Report every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
